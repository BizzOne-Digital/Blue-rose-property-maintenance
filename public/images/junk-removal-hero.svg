<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Junk removal truck">
  <defs>
    <radialGradient id="glow" cx="65%" cy="45%" r="60%">
      <stop offset="0" stop-color="#2f8bff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#0a47e0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#030610" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#b9c6dc"/>
      <stop offset="1" stop-color="#6d7c97"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f63ff"/>
      <stop offset="1" stop-color="#0a2fa0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#030610"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect y="760" width="1600" height="240" fill="#050b1a"/>
  <rect y="758" width="1600" height="4" fill="#2f8bff" opacity="0.7"/>
  <!-- cargo box -->
  <rect x="640" y="330" width="560" height="360" rx="14" fill="url(#body)"/>
  <rect x="640" y="330" width="560" height="14" rx="7" fill="url(#chrome)"/>
  <!-- cab -->
  <path d="M1200 430h150l100 120v140h-250z" fill="url(#body)"/>
  <path d="M1250 450h90l62 80h-152z" fill="#0b1a3f"/>
  <rect x="1200" y="690" width="260" height="22" rx="6" fill="url(#chrome)"/>
  <!-- junk pile -->
  <g fill="#8a97b0" opacity="0.9">
    <rect x="690" y="250" width="150" height="90" rx="8" transform="rotate(-6 690 250)"/>
    <rect x="850" y="240" width="120" height="100" rx="8" transform="rotate(5 850 240)"/>
    <rect x="980" y="270" width="140" height="70" rx="8" transform="rotate(-3 980 270)"/>
  </g>
  <!-- wheels -->
  <g>
    <circle cx="800" cy="720" r="62" fill="#0b0f1c" stroke="url(#chrome)" stroke-width="10"/>
    <circle cx="1340" cy="720" r="62" fill="#0b0f1c" stroke="url(#chrome)" stroke-width="10"/>
  </g>
  <text x="920" y="520" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="2">BLUE ROSE</text>
</svg>
